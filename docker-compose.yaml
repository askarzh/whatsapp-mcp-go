services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER in environment or .env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASS:?set POSTGRES_PASS in environment or .env}"
      POSTGRES_DB: whatsapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  wa-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: wa-bridge
    restart: always
    environment:
      WHATSAPP_API_KEY: "${WHATSAPP_API_KEY:?set WHATSAPP_API_KEY in environment or .env}"
      WHATSAPP_JWT_SECRET: "${WHATSAPP_JWT_SECRET:?set WHATSAPP_JWT_SECRET in environment or .env}"
      # Times on /bridge/v1 are UTC by contract and the messages table keeps
      # no zone; a container in a local zone would label them wrongly.
      TZ: "UTC"
      IS_POSTGRES: "true"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASS: "${POSTGRES_PASS}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: "${POSTGRES_SSLMODE:-disable}"
      MEDIA_ALLOWED_DIRS: "${MEDIA_ALLOWED_DIRS:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      AUTH_LOGIN_RATE: "${AUTH_LOGIN_RATE:-}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      HOST: "${HOST:-}"
      PORT: "${PORT:-8080}"
      # Mindet's own bearer for /bridge/v1 (platform spec §6); unset disables
      # the contract surface. ≥32 chars: openssl rand -base64 48
      MINDET_BRIDGE_TOKEN: "${MINDET_BRIDGE_TOKEN:-}"
      # files[].path on the contract are relative to this root; the bridge's
      # MEDIA_DOWNLOAD_DIR must be inside it.
      MEDIA_SHARED_ROOT: "${MEDIA_SHARED_ROOT:-/shared}"
      MEDIA_DOWNLOAD_DIR: "${MEDIA_DOWNLOAD_DIR:-/shared/whatsapp}"
      # Where the QR-link page is reachable from the owner's browser. The
      # bridge refuses to start when MINDET_BRIDGE_TOKEN is set and this is
      # unset or still localhost: the login link would open nowhere.
      BRIDGE_PUBLIC_URL: "${BRIDGE_PUBLIC_URL:-http://localhost:8080}"
    ports:
      - "8080:8080"
    volumes:
      - bridge-store:/project/store
      - shared:/shared
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "128M"
        reservations:
          cpus: "0.5"
          memory: "64M"

  wa-mcp:
    build:
      context: ./whatsapp-mcp-server
      dockerfile: Dockerfile
    container_name: wa-mcp
    restart: always
    environment:
      WHATSAPP_API_KEY: "${WHATSAPP_API_KEY:?set WHATSAPP_API_KEY in environment or .env}"
      API_BASE_URL: "http://wa-bridge:8080/api"
      IS_HTTP: "true"
      HTTP_BASE_URL: "0.0.0.0:5777"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    ports:
      - "5777:5777"
    volumes:
      - shared:/shared
    depends_on:
      - wa-bridge
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "64M"
        reservations:
          cpus: "0.25"
          memory: "32M"

volumes:
  pgdata:
  bridge-store:
  shared:
